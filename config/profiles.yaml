# ══════════════════════════════════════
# Syntrix Trading Profiles
# ══════════════════════════════════════
# Each profile defines risk tolerance, execution parameters,
# and operational constraints.
#
# Active profiles: leve, moderado
# Inactive: agressivo, extremo (available for future use)

profiles:
  leve:
    active: true
    description: "Conservative profile — capital preservation priority"
    risk:
      stop_gain: 30.0
      stop_loss: -15.0
      max_drawdown_pct: 5.0
      max_trades_per_hour: 5
      max_consecutive_losses: 2
      cooldown_after_loss_sec: 60
      cooldown_after_trade_sec: 30
      min_payout_threshold: 0.65
      session_end_hour_utc: 23
      enable_safe_mode: true
      safe_mode_after_losses: 3
    execution:
      jitter_range_ms: [100, 400]
      min_spacing_sec: 10.0
      max_retries: 1
      max_latency_ms: 400
    context:
      min_payout: 0.65
      max_trades_per_hour: 10
      max_drawdown_pct: 5.0
      cooldown_seconds: 30
      blocked_regimes: ["unstable"]
    scoring:
      min_final_score: 0.40
    trade:
      amount: 2.0
      duration: 60

  moderado:
    active: true
    description: "Moderate profile — balanced risk/reward"
    risk:
      stop_gain: 50.0
      stop_loss: -30.0
      max_drawdown_pct: 10.0
      max_trades_per_hour: 10
      max_consecutive_losses: 3
      cooldown_after_loss_sec: 180
      cooldown_after_trade_sec: 120
      min_payout_threshold: 0.70
      session_end_hour_utc: 21
      enable_safe_mode: true
      safe_mode_after_losses: 5
    execution:
      jitter_range_ms: [50, 300]
      min_spacing_sec: 5.0
      max_retries: 2
      max_latency_ms: 500
    context:
      min_payout: 0.70
      max_trades_per_hour: 10
      max_drawdown_pct: 10.0
      cooldown_seconds: 120
      blocked_regimes: ["unstable"]
    scoring:
      min_final_score: 0.55
    trade:
      amount: 5.0
      duration: 60

  agressivo:
    active: false
    description: "Aggressive profile — higher risk tolerance (INACTIVE)"
    risk:
      stop_gain: 100.0
      stop_loss: -50.0
      max_drawdown_pct: 15.0
      max_trades_per_hour: 15
      max_consecutive_losses: 4
      cooldown_after_loss_sec: 120
      cooldown_after_trade_sec: 60
      min_payout_threshold: 0.65
      session_end_hour_utc: 22
      enable_safe_mode: true
      safe_mode_after_losses: 7
    execution:
      jitter_range_ms: [30, 200]
      min_spacing_sec: 3.0
      max_retries: 2
      max_latency_ms: 600
    context:
      min_payout: 0.65
      max_trades_per_hour: 15
      max_drawdown_pct: 15.0
      cooldown_seconds: 60
      blocked_regimes: []
    scoring:
      min_final_score: 0.45
    trade:
      amount: 10.0
      duration: 60

  extremo:
    active: false
    description: "Extreme profile — maximum exposure (INACTIVE / EXPERIMENTAL)"
    risk:
      stop_gain: 200.0
      stop_loss: -100.0
      max_drawdown_pct: 25.0
      max_trades_per_hour: 20
      max_consecutive_losses: 5
      cooldown_after_loss_sec: 60
      cooldown_after_trade_sec: 30
      min_payout_threshold: 0.60
      session_end_hour_utc: 23
      enable_safe_mode: false
      safe_mode_after_losses: 10
    execution:
      jitter_range_ms: [20, 150]
      min_spacing_sec: 2.0
      max_retries: 3
      max_latency_ms: 800
    context:
      min_payout: 0.60
      max_trades_per_hour: 20
      max_drawdown_pct: 25.0
      cooldown_seconds: 30
      blocked_regimes: []
    scoring:
      min_final_score: 0.35
    trade:
      amount: 25.0
      duration: 60

# Default settings
defaults:
  profile: leve
  mode: demo  # dry-run / demo / live
  assets:
    # OTC (always available)
    - EURUSD-OTC
    - GBPUSD-OTC
    - EURJPY-OTC
    - USDJPY-OTC
    - AUDCAD-OTC
    - AUDUSD-OTC
    - EURGBP-OTC
    - GBPJPY-OTC
    - NZDUSD-OTC
    - USDCAD-OTC
    - USDCHF-OTC
    - EURAUD-OTC
    - GBPAUD-OTC
    - CADJPY-OTC
    - CHFJPY-OTC
    # Forex regular (session-dependent)
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - EURJPY
    - GBPJPY
    - USDCAD
    - USDCHF
    - EURGBP
    - NZDUSD
  broker:
    name: iqoption
    practice: true
  logging:
    level: INFO
    trade_log_dir: data/trade_logs
  data:
    db_path: data/syntrix.db
